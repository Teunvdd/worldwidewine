<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — WorldWideWine.nl</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ce542b">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <!-- Bij het opstarten: laad-rondje tot bekend is of je bent ingelogd -->
  <div class="boot" id="boot"><span class="spinner spinner-lg"></span></div>

  <!-- Inloggen -->
  <div class="login" id="login" hidden>
    <form class="login-box" id="login-form" aria-label="Inloggen admin">
      <img src="/assets/logo.png" alt="worldwidewine.nl — dranken en culinaire projecten" width="986" height="135" class="login-logo">
      <p class="muted">Admin &amp; kassa</p>
      <label class="field">Wachtwoord<input type="password" name="password" autocomplete="current-password" required autofocus></label>
      <p class="error" id="login-error" role="alert" hidden></p>
      <button class="btn btn-primary btn-block" type="submit">Inloggen</button>
      <a class="muted small" href="/">← Naar de website</a>
    </form>
  </div>

  <!-- App -->
  <div class="app" id="app" hidden>
    <aside class="sidebar">
      <a class="logo" href="#dashboard">
        <img src="/assets/logo-light.png" alt="worldwidewine.nl — dranken en culinaire projecten" width="986" height="135" class="logo-full">
        <img src="/favicon.png" alt="" width="64" height="64" class="logo-mark">
      </a>
      <nav class="menu" id="menu">
        <a href="#dashboard" data-view="dashboard"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></span><span>Overzicht</span></a>
        <div class="menu-group" id="menu-kassa">
          <button class="menu-head" type="button" aria-expanded="false" aria-controls="menu-kassa-sub"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="10" width="18" height="11" rx="2"/><path d="M7 10V5a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v5M7 14h2M11 14h2M15 14h2M7 17h10"/></svg></span><span>Kassa</span><span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span></button>
          <div class="menu-sub" id="menu-kassa-sub">
            <a href="#kassa" data-view="kassa"><span class="l">Openen &amp; diensten</span><span class="ml">Kassa</span></a>
            <a href="#kassa-categorieen" data-view="kassa-categorieen"><span class="l">Categorieën</span><span class="ml">Kassacategorieën</span></a>
            <a href="#kassa-instellingen" data-view="kassa-instellingen"><span class="l">Instellingen</span><span class="ml">Kassa-instellingen</span></a>
          </div>
        </div>
        <a href="#bestellingen" data-view="bestellingen"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h4"/></svg></span><span>Bestellingen</span><b class="pill" id="open-count" hidden></b></a>
        <a href="#producten" data-view="producten"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2h8l-.6 6.2a3.4 3.4 0 0 1-6.8 0z"/><path d="M12 12v8M8 22h8"/></svg></span><span>Producten</span></a>
        <a href="#voorraad" data-view="voorraad"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/></svg></span><span>Voorraad</span><b class="pill pill-warn" id="low-count" hidden></b></a>
        <a href="#klanten" data-view="klanten"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.8c1.6.8 2.6 2.5 3 5.2"/></svg></span><span>Klanten</span></a>
        <div class="menu-group" id="menu-winkel">
          <button class="menu-head" type="button" aria-expanded="false" aria-controls="menu-winkel-sub"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9.5 4.6 4h14.8L21 9.5"/><path d="M3 9.5a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0"/><path d="M5 12v8h14v-8M10 20v-5h4v5"/></svg></span><span>Winkel</span><span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span></button>
          <div class="menu-sub" id="menu-winkel-sub">
            <a href="#openingstijden" data-view="openingstijden"><span class="l">Openingstijden</span><span class="ml">Openingstijden</span></a>
            <a href="#afhaaltijden" data-view="afhaaltijden"><span class="l">Afhaaltijden</span><span class="ml">Afhaaltijden</span></a>
            <a href="#bezorggebied" data-view="bezorggebied"><span class="l">Bezorggebied</span><span class="ml">Bezorggebied</span></a>
          </div>
        </div>
        <a href="#nieuws" data-view="nieuws"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a1 1 0 0 1 1-1h11a1 1 0 0 1 1 1v14a1 1 0 0 0 2 0V8h1a1 1 0 0 1 1 1v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M8 8h5M8 12h5M8 16h3"/></svg></span><span>Nieuws</span></a>
      </nav>
      <div class="sidebar-foot">
        <a class="foot-link" href="/webshop.html" target="_blank" rel="noopener"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></span><span>Webshop bekijken</span></a>
        <button class="btn btn-logout" id="logout" type="button"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10"/></svg></span><span>Uitloggen</span></button>
      </div>
    </aside>
    <main class="main" id="view" tabindex="-1"></main>
  </div>

  <!-- Venster voor formulieren en details -->
  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-modal-close></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header class="modal-head">
        <h2 id="modal-title"></h2>
        <button class="icon-btn" type="button" data-modal-close aria-label="Sluiten">×</button>
      </header>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Kassabon (alleen zichtbaar bij afdrukken) -->
  <div class="receipt-print" id="receipt-print"></div>

  <script src="/data/products.js"></script>
  <script src="/data/config.js"></script>
  <script src="/data/order.js"></script>
  <script src="/admin/js/core.js"></script>
  <script src="/admin/js/dashboard.js"></script>
  <script src="/admin/js/pos.js"></script>
  <script src="/admin/js/orders.js"></script>
  <script src="/admin/js/xlsx.js"></script>
  <script src="/admin/js/products.js"></script>
  <script src="/admin/js/stock.js"></script>
  <script src="/admin/js/customers.js"></script>
  <script src="/admin/js/settings.js"></script>
  <script src="/admin/js/news.js"></script>
  <script src="/admin/js/winkel.js"></script>
  <script>A.start();</script>
</body>
</html>
